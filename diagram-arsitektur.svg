<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" width="1080" height="880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #111827; }
      .subtitle { font-size: 14px; fill: #6b7280; }
      .layerlabel { font-size: 15px; font-weight: bold; fill: #111827; }
      .boxtitle { font-size: 14px; font-weight: bold; fill: #111827; }
      .boxtext { font-size: 11.5px; fill: #4b5563; }
      .note { font-size: 12px; fill: #6b7280; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="880" fill="#ffffff"/>
  <text x="40" y="44" class="title">Arsitektur Sistem Absensi Digital Sekolah</text>
  <text x="40" y="68" class="subtitle">Rancangan tingkat tinggi — offline-first, web-based (PWA), notifikasi WhatsApp</text>

  <!-- LAYER 1 -->
  <rect x="30" y="96" width="1020" height="132" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="46" y="120" class="layerlabel">LAPIS 1 · PERANGKAT &amp; PENGGUNA</text>

  <rect x="52" y="136" width="222" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="163" y="162" text-anchor="middle" class="boxtitle">Kiosk / Gerbang</text>
  <text x="163" y="180" text-anchor="middle" class="boxtext">Tablet 10" + pemindai QR</text>
  <text x="163" y="196" text-anchor="middle" class="boxtext">atau pembaca kartu RFID</text>

  <rect x="296" y="136" width="222" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="407" y="162" text-anchor="middle" class="boxtitle">HP Guru Piket / Mapel</text>
  <text x="407" y="180" text-anchor="middle" class="boxtext">Mode pemindaian cepat</text>
  <text x="407" y="196" text-anchor="middle" class="boxtext">Presensi per jam pelajaran</text>

  <rect x="540" y="136" width="222" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="651" y="162" text-anchor="middle" class="boxtitle">HP Orang Tua</text>
  <text x="651" y="180" text-anchor="middle" class="boxtext">Notifikasi WhatsApp</text>
  <text x="651" y="196" text-anchor="middle" class="boxtext">Form pengajuan izin</text>

  <rect x="784" y="136" width="222" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="895" y="162" text-anchor="middle" class="boxtitle">Laptop Admin / TU</text>
  <text x="895" y="180" text-anchor="middle" class="boxtext">Data master, laporan,</text>
  <text x="895" y="196" text-anchor="middle" class="boxtext">pengaturan &amp; audit</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="540" y1="228" x2="540" y2="272" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="556" y="256" class="note">HTTPS · antrean lokal saat offline</text>

  <!-- LAYER 2 -->
  <rect x="30" y="278" width="1020" height="256" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="46" y="302" class="layerlabel">LAPIS 2 · APLIKASI &amp; LAYANAN</text>

  <rect x="52" y="318" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="163" y="344" text-anchor="middle" class="boxtitle">Gerbang API</text>
  <text x="163" y="362" text-anchor="middle" class="boxtext">Validasi, pembatasan laju,</text>
  <text x="163" y="378" text-anchor="middle" class="boxtext">pencegahan absen ganda,</text>
  <text x="163" y="394" text-anchor="middle" class="boxtext">penerimaan sinkronisasi</text>

  <rect x="296" y="318" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="407" y="344" text-anchor="middle" class="boxtitle">Autentikasi &amp; Otorisasi</text>
  <text x="407" y="362" text-anchor="middle" class="boxtext">Login, peran (RBAC),</text>
  <text x="407" y="378" text-anchor="middle" class="boxtext">token perangkat kiosk,</text>
  <text x="407" y="394" text-anchor="middle" class="boxtext">kadaluwarsa sesi</text>

  <rect x="540" y="318" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="651" y="344" text-anchor="middle" class="boxtitle">Layanan Absensi</text>
  <text x="651" y="362" text-anchor="middle" class="boxtext">MESIN STATUS: Hadir,</text>
  <text x="651" y="378" text-anchor="middle" class="boxtext">Terlambat, Sakit, Izin,</text>
  <text x="651" y="394" text-anchor="middle" class="boxtext">Dispensasi, Alpa, Bolos</text>

  <rect x="784" y="318" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="895" y="344" text-anchor="middle" class="boxtitle">Izin &amp; Persetujuan</text>
  <text x="895" y="362" text-anchor="middle" class="boxtext">Pengajuan, unggah bukti,</text>
  <text x="895" y="378" text-anchor="middle" class="boxtext">alur setuju berjenjang,</text>
  <text x="895" y="394" text-anchor="middle" class="boxtext">penimpaan status ALPA</text>

  <rect x="52" y="424" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="163" y="450" text-anchor="middle" class="boxtitle">Mesin Notifikasi</text>
  <text x="163" y="468" text-anchor="middle" class="boxtext">WhatsApp (utama),</text>
  <text x="163" y="484" text-anchor="middle" class="boxtext">email &amp; SMS cadangan,</text>
  <text x="163" y="500" text-anchor="middle" class="boxtext">jadwal &amp; template pesan</text>

  <rect x="296" y="424" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="407" y="450" text-anchor="middle" class="boxtitle">Laporan &amp; Analitik</text>
  <text x="407" y="468" text-anchor="middle" class="boxtext">Dashboard harian/bulanan,</text>
  <text x="407" y="484" text-anchor="middle" class="boxtext">deteksi pola alpa,</text>
  <text x="407" y="500" text-anchor="middle" class="boxtext">ekspor Excel / PDF</text>

  <rect x="540" y="424" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="651" y="450" text-anchor="middle" class="boxtitle">Sinkronisasi Offline</text>
  <text x="651" y="468" text-anchor="middle" class="boxtext">Antrean tertunda, ID unik,</text>
  <text x="651" y="484" text-anchor="middle" class="boxtext">penyelesaian konflik,</text>
  <text x="651" y="500" text-anchor="middle" class="boxtext">tanpa data dobel</text>

  <rect x="784" y="424" width="222" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="895" y="450" text-anchor="middle" class="boxtitle">Jejak Audit</text>
  <text x="895" y="468" text-anchor="middle" class="boxtext">Siapa, kapan, nilai lama</text>
  <text x="895" y="484" text-anchor="middle" class="boxtext">&amp; baru, alasan perubahan</text>
  <text x="895" y="500" text-anchor="middle" class="boxtext">(append-only)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="540" y1="534" x2="540" y2="578" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 3 -->
  <rect x="30" y="584" width="1020" height="132" rx="12" fill="#fef3c7" stroke="#fde68a" stroke-width="2"/>
  <text x="46" y="608" class="layerlabel">LAPIS 3 · PENYIMPANAN DATA</text>

  <rect x="52" y="624" width="222" height="72" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="163" y="650" text-anchor="middle" class="boxtitle">Basis Data Utama</text>
  <text x="163" y="668" text-anchor="middle" class="boxtext">Siswa, kelas, jadwal,</text>
  <text x="163" y="684" text-anchor="middle" class="boxtext">kehadiran, pengajuan</text>

  <rect x="296" y="624" width="222" height="72" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="407" y="650" text-anchor="middle" class="boxtitle">Penyimpanan Berkas</text>
  <text x="407" y="668" text-anchor="middle" class="boxtext">Foto surat izin,</text>
  <text x="407" y="684" text-anchor="middle" class="boxtext">hasil ekspor PDF</text>

  <rect x="540" y="624" width="222" height="72" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="651" y="650" text-anchor="middle" class="boxtitle">Antrean &amp; Cache</text>
  <text x="651" y="668" text-anchor="middle" class="boxtext">Performa saat jam puncak</text>
  <text x="651" y="684" text-anchor="middle" class="boxtext">absen pagi</text>

  <rect x="784" y="624" width="222" height="72" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="895" y="650" text-anchor="middle" class="boxtitle">Pencadangan</text>
  <text x="895" y="668" text-anchor="middle" class="boxtext">Harian (30) + bulanan (12),</text>
  <text x="895" y="684" text-anchor="middle" class="boxtext">uji pemulihan 3 bulan</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="540" y1="716" x2="540" y2="760" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 4 -->
  <rect x="30" y="766" width="1020" height="94" rx="12" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="2"/>
  <text x="46" y="790" class="layerlabel">LAPIS 4 · INTEGRASI EKSTERNAL</text>

  <rect x="52" y="802" width="222" height="46" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="163" y="824" text-anchor="middle" class="boxtitle">WhatsApp Business API</text>
  <text x="163" y="840" text-anchor="middle" class="boxtext">Notifikasi orang tua</text>

  <rect x="296" y="802" width="222" height="46" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="407" y="824" text-anchor="middle" class="boxtitle">Dapodik / NISN</text>
  <text x="407" y="840" text-anchor="middle" class="boxtext">Sinkron data siswa</text>

  <rect x="540" y="802" width="222" height="46" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="651" y="824" text-anchor="middle" class="boxtitle">e-Rapor</text>
  <text x="651" y="840" text-anchor="middle" class="boxtext">Rekap kehadiran siswa</text>

  <rect x="784" y="802" width="222" height="46" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="895" y="824" text-anchor="middle" class="boxtitle">Cetak / Ekspor</text>
  <text x="895" y="840" text-anchor="middle" class="boxtext">PDF, Excel, CSV</text>
</svg>
