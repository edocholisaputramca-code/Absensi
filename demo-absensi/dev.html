<!DOCTYPE html><html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Sistem Absensi Digital — SMKN 1 Mojosari</title>
<link rel="stylesheet" href="src/00-style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>🎓 AbsensiKu</h1>
      <p>SMKN 1 Mojosari · Demo</p>
    </div>
    <div class="rolebox">
      <label>Coba sebagai (peran)</label>
      <select id="roleSel" onchange="setRole(this.value)"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot" id="connFoot"><span class="dot"></span><span id="connTxt">Online · tersinkron</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div class="rowflex">
        <span class="pill" id="clockPill">—</span>
        <span class="pill" id="jamPill">—</span>
        <button class="btn sm" onclick="toggleOffline()" id="offBtn">🌐 Online</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div>
<script src="src/01-util.js"></script>
<script src="src/02-excel.js"></script>
<script src="src/03-data.js"></script>
<script src="src/04-state.js"></script>
<script src="src/05-qr.js"></script>
<script src="src/06-navigasi.js"></script>
<script src="src/07-dashboard.js"></script>
<script src="src/08-absensi.js"></script>
<script src="src/09-presensi.js"></script>
<script src="src/10-izin.js"></script>
<script src="src/11-kartu.js"></script>
<script src="src/12-siswa.js"></script>
<script src="src/13-laporan.js"></script>
<script src="src/14-unduhan.js"></script>
<script src="src/15-pengaturan.js"></script>
<script src="src/16-audit.js"></script>
<script src="src/17-init.js"></script>
</body>
</html>
